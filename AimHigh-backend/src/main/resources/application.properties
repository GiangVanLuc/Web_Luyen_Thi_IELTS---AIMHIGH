spring.application.name=AimHigh-backend


# Database configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Server configuration
server.port=${SERVER_PORT}

# JWT configuration
app.jwt.secret-key=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION}

spring.main.banner-mode=console
logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}

# Google Oauth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_OAUTH2_SCOPE}

# Frontend run Live Server port 5500
app.frontend-url=http://localhost:5500/AimHigh-IELTS-Website
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

#Redis configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Cloudinary media storage
app.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.storage.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.storage.cloudinary.listening-prefix=${CLOUDINARY_LISTENING_PREFIX:aimhigh/listening}
app.storage.cloudinary.avatar-prefix=${CLOUDINARY_AVATAR_PREFIX:aimhigh/avatars}
app.storage.cloudinary.max-audio-bytes=${CLOUDINARY_MAX_AUDIO_BYTES:52428800}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
